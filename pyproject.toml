[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emricat"
version = "0.0.1"
description = "EMRI rates and catalogues from MBH population models (MBHcat spin-off)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
data = ["gdown"]       # for download_data.py

[project.scripts]
emricat-run = "emricat.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["emricat*"]

[tool.setuptools.package-data]
emricat = ["plotting/*.mplstyle", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # tests run even without `pip install -e .`
